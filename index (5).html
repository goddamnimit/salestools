<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sales Desk — Urable</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sales Desk">
<meta name="theme-color" content="#12202b">
<link rel="manifest" href='data:application/manifest+json,{"name":"Sales Desk","short_name":"Sales Desk","start_url":".","display":"standalone","background_color":"%23f6f7f4","theme_color":"%2312202b","icons":[{"src":"data:image/svg%2Bxml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 192 192%27%3E%3Crect width=%27192%27 height=%27192%27 rx=%2742%27 fill=%27%2312202b%27/%3E%3Ctext x=%2796%27 y=%27128%27 font-size=%2796%27 font-family=%27Georgia,serif%27 fill=%27%23e8b04b%27 text-anchor=%27middle%27%3ES%3C/text%3E%3C/svg%3E","sizes":"192x192","type":"image/svg+xml"}]}'>
<style>
:root{
  --ink:#12202b; --ink-2:#31404d;
  --paper:#f6f7f4; --card:#fff; --line:#dfe3da; --line-2:#eceee8;
  --accent:#155e75; --accent-soft:#e3f0f3; --accent-dk:#0e4a5c;
  --gold:#b0801f; --gold-soft:#fdf4e0;
  --green:#1a7f4f; --red:#a8342c; --mute:#6b7480;
  --mono:'SF Mono',ui-monospace,'Cascadia Code',Menlo,monospace;
  --sans:'Avenir Next','Segoe UI',system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--sans);background:var(--paper);color:var(--ink);line-height:1.5;-webkit-text-size-adjust:100%}
button,input,textarea,select{font-family:inherit}
/* ---------- header ---------- */
header{background:var(--ink);color:#fff;padding:calc(14px + env(safe-area-inset-top)) 22px 0;position:sticky;top:0;z-index:30}
.hrow{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{font-size:1.05rem;font-weight:600;letter-spacing:.02em}
.brand span{color:#e8b04b}
.hspace{flex:1}
.hbtn{font-size:.76rem;padding:6px 11px;border-radius:6px;cursor:pointer;border:1px solid #35434f;background:#1e2d3a;color:#d5e0e8}
.hbtn:hover{background:#2a3a48}
.tabs{display:flex;gap:2px;margin-top:12px;overflow-x:auto}
.tab{padding:9px 16px;border:none;background:none;color:#93a6b4;font-size:.86rem;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
.tab:hover{color:#fff}
.tab.on{color:#fff;border-bottom-color:#e8b04b;font-weight:600}
/* ---------- layout ---------- */
.wrap{display:flex;align-items:flex-start}
nav{width:222px;flex:0 0 222px;background:var(--card);border-right:1px solid var(--line);padding:14px 0;position:sticky;top:104px;max-height:calc(100vh - 104px);overflow-y:auto}
nav .nlabel{font-size:.68rem;letter-spacing:.09em;text-transform:uppercase;color:#98a2ac;padding:8px 20px 5px}
nav button{display:flex;width:100%;text-align:left;padding:8px 20px;border:none;background:none;cursor:pointer;font-size:.85rem;color:var(--ink);border-left:3px solid transparent;gap:6px}
nav button:hover{background:var(--accent-soft)}
nav button.on{border-left-color:var(--accent);background:var(--accent-soft);font-weight:600}
nav .ct{margin-left:auto;color:#98a2ac;font-size:.74rem;font-weight:400}
main{flex:1;min-width:0;padding:20px 26px 80px;max-width:900px}
/* ---------- toolbar ---------- */
.toolbar{display:flex;gap:9px;margin-bottom:8px;flex-wrap:wrap;align-items:center}
.search{flex:1;min-width:190px;padding:10px 13px;border:1px solid var(--line);border-radius:8px;font-size:.9rem;background:var(--card)}
.search:focus{outline:2px solid var(--accent);outline-offset:-1px}
.chk{display:flex;align-items:center;gap:6px;font-size:.8rem;color:var(--mute);cursor:pointer}
.hint{font-size:.73rem;color:#98a2ac;margin-bottom:16px}
kbd{background:#eceee8;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 4px;font-family:var(--mono);font-size:.72rem}
/* ---------- pinned ---------- */
.pinbar{background:var(--gold-soft);border:1px solid #f0e2c0;border-radius:10px;padding:11px 13px;margin-bottom:20px}
.pinbar h3{font-size:.68rem;letter-spacing:.09em;text-transform:uppercase;color:var(--gold);margin-bottom:8px}
.pinchips{display:flex;flex-wrap:wrap;gap:6px}
.pinchip{background:#fff;border:1px solid #ecdcb4;border-radius:20px;padding:5px 13px;font-size:.8rem;cursor:pointer;color:var(--ink)}
.pinchip:hover{border-color:var(--gold);background:#fffdf7}
/* ---------- cards ---------- */
.cat-h{font-size:1rem;font-weight:700;margin:22px 0 3px;scroll-margin-top:120px}
.cat-d{font-size:.79rem;color:var(--mute);margin-bottom:11px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;margin-bottom:11px;overflow:hidden}
.card.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.card.flagged{opacity:.5}
.card.flagged .body{text-decoration:line-through;color:#98a2ac}
.chead{display:flex;align-items:center;gap:9px;padding:10px 14px;cursor:pointer;user-select:none}
.chead:hover{background:#fafbf8}
.star{background:none;border:none;cursor:pointer;font-size:.95rem;line-height:1;color:#cdd3ca;padding:2px}
.star.on{color:#e0a51e}
.chev{font-size:.62rem;color:#a4adb6;transition:transform .15s}
.card.open .chev{transform:rotate(90deg)}
.ctitle{font-weight:600;font-size:.9rem;flex:1;min-width:0}
.meta{font-size:.68rem;color:#a4adb6;white-space:nowrap}
.tag{font-size:.64rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:2px 7px;border-radius:20px;background:var(--accent-soft);color:var(--accent)}
.tag.email{background:var(--gold-soft);color:var(--gold)}
.tag.call{background:#e8f0e6;color:#3d6b34}
.tag.note{background:#eeeeec;color:#6b7480}
.cbody{display:none;border-top:1px solid var(--line-2)}
.card.open .cbody{display:block}
.body{white-space:pre-wrap;font-family:var(--mono);font-size:.815rem;padding:14px;line-height:1.62;color:#26313d}
.body .mf{background:#dff0e5;border-radius:3px;padding:0 2px;color:#14603a;font-weight:600}
.body .mf.pf{background:#e3f0f3;color:var(--accent)}
.warn{font-size:.74rem;color:var(--gold);padding:11px 14px 0;font-style:italic}
.acts{display:flex;gap:7px;padding:0 14px 13px;flex-wrap:wrap}
.acts button{font-size:.78rem;padding:6px 12px;border-radius:7px;cursor:pointer;border:1px solid var(--line);background:#fff;color:var(--ink)}
.acts button:hover{background:#f2f3f0}
.bcopy{background:var(--accent);color:#fff!important;border-color:var(--accent)!important;font-weight:600}
.bcopy:hover{background:var(--accent-dk)!important}
.bcopy.ok{background:var(--green)!important;border-color:var(--green)!important}
.bsave{background:var(--green);color:#fff!important;border-color:var(--green)!important;font-weight:600}
.bdel{color:var(--red)!important}
/* ---------- editor ---------- */
.ed{padding:14px}
.ed label{display:block;font-size:.7rem;letter-spacing:.07em;text-transform:uppercase;color:var(--mute);margin:10px 0 4px}
.ed label:first-child{margin-top:0}
.ed input,.ed select,.ed textarea{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:7px;font-size:.86rem;background:#fff}
.ed textarea{font-family:var(--mono);font-size:.815rem;line-height:1.62;min-height:170px;resize:vertical}
.ed input:focus,.ed textarea:focus,.ed select:focus{outline:2px solid var(--accent);outline-offset:-1px}
.mfhelp{font-size:.72rem;color:var(--mute);margin-top:6px}
.mfhelp code{background:#eceee8;border-radius:3px;padding:1px 4px;font-family:var(--mono);cursor:pointer}
.mfhelp code:hover{background:#dde2da}
.addbtn{display:block;width:100%;padding:10px;border:1px dashed var(--line);border-radius:10px;background:none;font-size:.83rem;color:var(--mute);cursor:pointer;margin:2px 0 20px}
.addbtn:hover{background:#fff;border-color:var(--accent);color:var(--accent)}
/* ---------- modal ---------- */
.scrim{position:fixed;inset:0;background:rgba(18,32,43,.5);display:flex;align-items:center;justify-content:center;padding:18px;z-index:60}
.modal{background:#fff;border-radius:12px;max-width:520px;width:100%;max-height:88vh;overflow-y:auto;box-shadow:0 20px 50px rgba(0,0,0,.28)}
.mhead{padding:16px 20px 10px;border-bottom:1px solid var(--line-2)}
.mhead h3{font-size:1rem}
.mhead p{font-size:.78rem;color:var(--mute);margin-top:3px}
.mbody{padding:16px 20px}
.mbody label{display:block;font-size:.7rem;letter-spacing:.07em;text-transform:uppercase;color:var(--mute);margin:0 0 4px}
.mrow{margin-bottom:13px}
.mbody input{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:7px;font-size:.9rem}
.mbody input:focus{outline:2px solid var(--accent);outline-offset:-1px}
.preview{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:12px;white-space:pre-wrap;font-family:var(--mono);font-size:.78rem;line-height:1.6;max-height:200px;overflow-y:auto;color:#26313d}
.mfoot{padding:12px 20px 18px;display:flex;gap:8px;justify-content:flex-end}
.mfoot button{font-size:.85rem;padding:9px 18px;border-radius:8px;cursor:pointer;border:1px solid var(--line);background:#fff}
.mfoot .prim{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:600}
/* ---------- playbook ---------- */
.pb{max-width:760px}
.pb h2{font-size:1.15rem;margin:26px 0 6px}
.pb h2:first-child{margin-top:0}
.pb h3{font-size:.92rem;margin:18px 0 5px;color:var(--ink-2)}
.pb p,.pb li{font-size:.88rem;color:#31404d;margin-bottom:7px}
.pb ul{padding-left:20px}
.pb .block{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:14px}
.pb .talk{border-left:3px solid var(--gold);background:var(--gold-soft);border-radius:0 8px 8px 0;padding:11px 14px;margin:8px 0;font-size:.86rem}
.pb .talk em{color:var(--gold);font-style:normal;font-weight:700;font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;display:block;margin-bottom:4px}
.swatch{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:7px;vertical-align:middle}
.time{font-family:var(--mono);font-size:.78rem;color:var(--accent);font-weight:600}
.cadence{border-left:2px solid var(--line);padding-left:18px;margin-left:6px}
.cstep{position:relative;padding-bottom:16px}
.cstep::before{content:'';position:absolute;left:-24px;top:5px;width:9px;height:9px;border-radius:50%;background:var(--accent);border:2px solid var(--paper)}
.cstep b{font-size:.87rem}
.cstep .cday{font-family:var(--mono);font-size:.72rem;color:var(--accent);letter-spacing:.03em}
.cstep a{color:var(--accent);font-size:.82rem;cursor:pointer;text-decoration:underline}
/* ---------- misc ---------- */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 20px;border-radius:8px;font-size:.85rem;opacity:0;transition:opacity .22s;pointer-events:none;z-index:80}
.toast.on{opacity:1}
.hide{display:none!important}
.empty{color:#98a2ac;font-size:.86rem;padding:36px 0;text-align:center}
@media(max-width:760px){
  header{padding-left:16px;padding-right:16px}
  .wrap{flex-direction:column}
  nav{width:100%;flex:none;position:static;max-height:none;border-right:none;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:4px;padding:9px}
  nav .nlabel{display:none}
  nav button{width:auto;border-left:none;border-radius:20px;padding:6px 12px;font-size:.8rem}
  nav button.on{border-left:none}
  nav .ct{margin-left:4px}
  main{padding:16px 14px 70px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<header>
  <div class="hrow">
    <div class="brand">Sales <span>Desk</span></div>
    <div class="hspace"></div>
    <button class="hbtn" id="bExport">Backup</button>
    <button class="hbtn" id="bImport">Restore</button>
    <button class="hbtn" id="bReset">Reset</button>
  </div>
  <div class="tabs">
    <button class="tab on" data-tab="lib">Templates</button>
    <button class="tab" data-tab="cad">Cadence</button>
    <button class="tab" data-tab="play">Playbook</button>
    <button class="tab" data-tab="prof">My Info</button>
  </div>
</header>

<div class="wrap">
  <nav id="nav"></nav>
  <main>
    <div id="viewLib">
      <div class="toolbar">
        <input class="search" id="q" type="search" placeholder="Search templates…">
        <label class="chk"><input type="checkbox" id="hideFlag"> Hide flagged</label>
        <label class="chk"><input type="checkbox" id="onlyFav"> Favorites only</label>
      </div>
      <p class="hint"><kbd>/</kbd> search · <kbd>↑</kbd><kbd>↓</kbd> move · <kbd>Enter</kbd> copy · <kbd>Esc</kbd> clear</p>
      <div id="pinbar"></div>
      <div id="content"></div>
    </div>
    <div id="viewCad" class="hide pb"></div>
    <div id="viewPlay" class="hide pb"></div>
    <div id="viewProf" class="hide pb"></div>
  </main>
</div>

<div class="toast" id="toast"></div>
<input type="file" id="fileIn" accept="application/json" class="hide">

<script>
/* ============================================================
   MERGE FIELDS
   PROFILE = filled once from your settings, auto-inserted
   CONTACT = asked each time you copy
   ============================================================ */
const PROFILE_FIELDS = {
  myname:  {label:'Your name',            ph:'e.g. Nimit',                     def:''},
  myphone: {label:'Your phone',           ph:'(555) 123-4567',                 def:''},
  myemail: {label:'Your email',           ph:'nimit@urable.com',               def:''},
  mycal:   {label:'Demo booking link',    ph:'https://calendly.com/…/30min',   def:'https://calendly.com/chase-urable/30min'},
  mysetup: {label:'Setup / Q&A link',     ph:'https://calendly.com/…',         def:'https://calendly.com/urable/account-set-up-video-meeting'}
};
const CONTACT_FIELDS = {
  name:  {label:'First name',      ph:'Alex'},
  time:  {label:'Time',            ph:'4:00 PM EST'},
  date:  {label:'Date',            ph:'Thursday 7/31'},
  link:  {label:'Meeting link',    ph:'paste from Google Calendar'},
  shop:  {label:'Shop / business', ph:'Coastal Detail Co.'}
};
const FIELDS = Object.assign({}, PROFILE_FIELDS, CONTACT_FIELDS);
const CAL30 = '{{mycal}}';
const CALSETUP = '{{mysetup}}';

/* ============================================================
   DEFAULT TEMPLATES
   ============================================================ */
const DEFAULTS = [
{cat:"Confirmations & Reminders", desc:"Monday confirmation sweep and day-of nudges. Send only if they don't answer the call.", items:[
 {id:"mon-confirm", t:"Weekly Confirmation (Monday sweep)", ch:"text", b:`Hi {{name}}, this is {{myname}} with Urable! Just reaching out to confirm our demo scheduled for {{time}}. At that time, feel free to join the call from your phone, tablet, or computer at this link:\n{{link}}\n\nPlease respond "C" to confirm your appointment. See you soon!`},
 {id:"day-remind", t:"Same-Day Demo Reminder", ch:"text", b:`Hey there! {{myname}} with Urable here. Just giving a quick reminder of our video call scheduled for {{time}} soon!\n\nAt the time of the call you can join from your computer, tablet, or smartphone at this link:\n{{link}}\n\nIf anything comes up feel free to text or call me here!`},
 {id:"in-meeting", t:"I'm In the Meeting", ch:"text", b:`Hey {{name}}, this is {{myname}} with Urable! I'm in the video call ready when you are. This is a Google Meet video call, so whenever you're ready you can join at this link:\n{{link}}`},
 {id:"ob-confirm", t:"Onboarding Call Confirmation", ch:"text", b:`Hi {{name}}, this is {{myname}} with Urable! I'm reaching out to confirm your Onboarding Call scheduled for today at {{time}}. We're excited to go over how Urable can help streamline your business!\n\nPlease respond "C" to confirm your appointment. See you soon!`},
 {id:"ob-dayof", t:"Onboarding Day-Of Reminder (casual)", ch:"text", b:`Hey there! It's {{myname}} with Urable again.\n\nJust wanted to give you a quick reminder about your onboarding call scheduled for {{time}}. If that time no longer works, just let me know and we'll find a better one.\n\nThanks, and have a great rest of your day! I'll be sure to follow up with you shortly after your call.`},
]},
{cat:"Booking & Rescheduling", desc:"Getting them onto the calendar.", items:[
 {id:"fe-connect", t:"Front-End Call — Connected", ch:"text", b:`Hey {{name}}, this is {{myname}} from Urable. Thanks for speaking with me earlier. Please use this link below to book a demo:\n${CAL30}\n\nI look forward to speaking with you on a demo soon!`},
 {id:"fe-noanswer", t:"Front-End Call — No Answer", ch:"text", b:`Hey, this is {{myname}} from Urable. I'm sorry we weren't able to connect today. I hope the free trial is going well. If you'd like to schedule a demo with me, please use this link below:\n${CAL30}\n\nI look forward to speaking with you on a demo soon!`},
 {id:"rep-resched", t:"Rep-Initiated Reschedule (apology)", ch:"text", b:`I apologize for the inconvenience, but I'm going to have to reschedule our demo on {{date}} due to internal scheduling issues. Please use the link below to reschedule for another time next week.\n${CAL30}\n\nAgain, I apologize for the inconvenience.\nBest,\n{{myname}}`},
 {id:"recorded-demo", t:"Recorded Demo (busy season)", ch:"text", b:`Hey {{name}}, it's {{myname}} with Urable. I know it's the busy season, so I recorded a quick demo for you to watch whenever you have a moment.\n\nOnce you've had a look, let me know and we can talk about getting your trial set up!`},
]},
{cat:"No-Show Recovery", desc:"After ~10 minutes with no join. Mark red in Calendar, no-show in Calendly.", items:[
 {id:"noshow-demo", t:"Demo No-Show — Reschedule", ch:"text", b:`Hey {{name}}, {{myname}} with Urable — I had us down for a call at {{time}} today but it looks like something came up on your end. No worries at all!\n\nWhenever you're ready, you can grab a new time here:\n${CAL30}`},
 {id:"waiting-room", t:"Still in the Waiting Room", ch:"text", b:`Hey {{name}}, I'm currently in the waiting room for our call. Please let me know if you need any help joining or if you'd rather reschedule.`},
 {id:"noshow-obs", t:"Onboarding No-Show", ch:"text", b:`Hey {{name}}! {{myname}} with Urable — I just saw you weren't able to attend your setup call and wanted to see when you'd like to reschedule. Feel free to text or call with any questions that come up, and have fun continuing to explore Urable in the meantime!`},
]},
{cat:"Post-Demo", desc:"Sent immediately after the call. Pick based on whether they subscribed mid-call.", items:[
 {id:"wrap-nosub", t:"Demo Wrap-Up Email — Did NOT subscribe", ch:"email", b:`Hi {{name}},\n\nThanks again for taking the time to join our Intro to Urable call — it was great connecting with you!\n\nNext step: attend your Onboarding Video Call. There we'll walk through your account and get everything set up for success.\nOnboarding call: {{link}}\n\nAdditionally, whenever you decide Urable is right for your business, you can log into your Urable account, click Billing in the bottom left corner, and review the available plans to choose the one that best fits your needs. You will NOT be charged until your trial is over.\n\nIf you'd like to talk through the plan options or have any questions at all, feel free to reply to this email or call/text me at {{myphone}}.\n\nLooking forward to getting everything up and running with you!\n\n{{myname}}\n{{myemail}}`},
 {id:"wrap-sub", t:"Demo Wrap-Up Email — DID subscribe", ch:"email", b:`Hi {{name}},\n\nThank you so much for taking the time to connect with me today. It was great showing you around the platform and discussing how we can support your goals.\n\nAs you dive in and get started, here's how you can get support whenever you need it:\n\n• Live Chat — for any questions or technical support, click the live chat icon in the Help Center at the bottom right of your screen. Our team is always ready to assist.\n\n• Video Tutorials — the Help Center also has a full library of video tutorials to guide you through every feature at your own pace.\n\n• Book a Q&A — need more hands-on guidance? Schedule a video call with our team directly through the Help Center by selecting "Book a Q&A".\n\nWe're thrilled to have you on board! Please don't hesitate to reach out if there's anything else we can do to help you get the most out of Urable.\n\n{{myname}}\n{{myphone}} · {{myemail}}`},
 {id:"intrial-email", t:"In-Trial Demo Email (setup + Virtual Shop)", ch:"email", b:`Hi {{name}},\n\nThanks so much for joining the call with me today! As I mentioned, here is the link for the free account setup service: [Free Account Set Up link]\n\nHere are the tutorial videos on the Virtual Shop as well: Opening the Virtual Shop, Virtual Shop Preferences, Linking the Virtual Shop\n\nI look forward to speaking with you again soon, and if you have any questions at all, please don't hesitate to reach out.\n\nThanks,\n{{myname}}`},
 {id:"demo-fu-email", t:"Demo Follow-Up Email (tutorial bundle)", ch:"email", b:`Hey {{name}},\n\nThank you for meeting with me today! Here are tutorial videos on the Virtual Shop and more: Short Term Reminders, Job Process (Short), Importing Customers and Products/Services, Different Types of Invoices, UrPay\n\nHere is the link to book an Onboarding Call: {{link}}\n\nI look forward to speaking with you again soon. If you have any questions, please don't hesitate to reach out.\n\nBest,\n{{myname}}`},
 {id:"demo-fu-text", t:"Demo Follow-Up Text", ch:"text", b:`Hey {{name}}! {{myname}} with Urable here — thank you for meeting with me and exploring Urable during your 14-day free trial. Feel free to text or call with any questions that come up.`},
 {id:"after-obs", t:"After Setup Call Check-In", ch:"text", b:`Hey {{name}}! {{myname}} with Urable — I just saw you finished your setup call and wanted to check in. Feel free to text or call with any questions that come up, and have fun continuing to explore Urable in the meantime!`},
]},
{cat:"Trial Check-Ins", desc:"Touchpoints during the 14-day trial.", items:[
 {id:"welcome", t:"Welcome / Day 1", ch:"text", b:`Hey there! Welcome to Urable :) I'm {{myname}}, and I'm here to help you figure this thing out!\n\nIf you'd like to become a Urable expert in 30 minutes or less, use this link to book a 1:1 video call with me: ${CAL30}\n\nIf you'd rather figure things out on your own, use our Help Center (the button in the bottom right corner of your Urable screen) for support chat and our tutorial video library. Happy trialing!`},

/* ============================================================
   STATE
   ============================================================ */
const KEY='salesdesk-v3';
let S = loadState();
function defaultProfile(){
  const p={};Object.keys(PROFILE_FIELDS).forEach(k=>p[k]=PROFILE_FIELDS[k].def||'');return p;
}
function loadState(){
  try{const r=localStorage.getItem(KEY); if(r){const d=JSON.parse(r);
    const prof=Object.assign(defaultProfile(),d.profile||{});
    if(d.me&&!d.profile)prof.myname=d.me;
    return {flags:d.flags||{},favs:d.favs||{},edits:d.edits||{},custom:d.custom||[],deleted:d.deleted||[],counts:d.counts||{},profile:prof};}
  }catch(e){}
  return {flags:{},favs:{},edits:{},custom:[],deleted:[],counts:{},profile:defaultProfile()};
}
function saveState(){
  try{localStorage.setItem(KEY,JSON.stringify(S));}
  catch(e){toast('Storage blocked — use Backup to keep your changes.');}
}
function toast(m){const t=el('toast');t.textContent=m;t.classList.add('on');clearTimeout(t._x);t._x=setTimeout(()=>t.classList.remove('on'),2200);}
function el(id){return document.getElementById(id);}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function attr(s){return esc(s).replace(/"/g,'&quot;');}

function categories(){
  const out = DEFAULTS.map(c=>({cat:c.cat,desc:c.desc,items:c.items
    .filter(i=>!S.deleted.includes(i.id))
    .map(i=>Object.assign({},i,S.edits[i.id]||{},{_edited:!!S.edits[i.id]}))}));
  S.custom.forEach(ci=>{
    if(S.deleted.includes(ci.id))return;
    let g=out.find(c=>c.cat===ci.cat);
    if(!g){g={cat:ci.cat,desc:'Templates you added.',items:[]};out.push(g);}
    g.items.push(Object.assign({},ci,S.edits[ci.id]||{},{_custom:true,_edited:!!S.edits[ci.id]}));
  });
  return out;
}
function findItem(id){
  for(const c of categories()) for(const i of c.items) if(i.id===id) return i;
  return null;
}
function usedFields(text){
  const found=[]; const re=/\{\{(\w+)\}\}/g; let m;
  while((m=re.exec(text))) if(!found.includes(m[1])) found.push(m[1]);
  return found;
}
function highlight(text){
  return esc(text).replace(/\{\{(\w+)\}\}/g,(_,k)=>{
    if(PROFILE_FIELDS[k]&&S.profile[k])
      return '<span class="mf pf">'+esc(S.profile[k])+'</span>';
    return '<span class="mf">{{'+k+'}}</span>';
  });
}

/* ============================================================
   RENDER — LIBRARY
   ============================================================ */
const nav=el('nav'), content=el('content');
let cards=[], selIdx=-1;

function render(){
  const cats=categories();
  nav.innerHTML='<div class="nlabel">Categories</div>';
  content.innerHTML='';
  cards=[];

  cats.forEach((c,ci)=>{
    const nb=document.createElement('button');
    nb.innerHTML=esc(c.cat)+'<span class="ct">'+c.items.length+'</span>';
    nb.onclick=()=>{el('cat-'+ci).scrollIntoView({behavior:'smooth'});
      nav.querySelectorAll('button').forEach(b=>b.classList.remove('on'));nb.classList.add('on');};
    nav.appendChild(nb);

    const h=document.createElement('h2');h.className='cat-h';h.id='cat-'+ci;h.textContent=c.cat;
    const d=document.createElement('p');d.className='cat-d';d.textContent=c.desc;
    content.append(h,d);
    c.items.forEach(i=>content.appendChild(card(i)));

    const add=document.createElement('button');
    add.className='addbtn';add.textContent='+ Add template to '+c.cat;
    add.onclick=()=>newTemplate(c.cat);
    content.appendChild(add);
  });

  const nb2=document.createElement('button');
  nb2.innerHTML='<span style="color:var(--accent)">+ New category</span>';
  nb2.onclick=()=>{const n=prompt('Name the new category:');if(n&&n.trim())newTemplate(n.trim());};
  nav.appendChild(nb2);

  renderPins();
  filter();
}

function renderPins(){
  const favs=[];
  categories().forEach(c=>c.items.forEach(i=>{if(S.favs[i.id])favs.push(i);}));
  if(!favs.length){el('pinbar').innerHTML='';return;}
  const bar=document.createElement('div');bar.className='pinbar';
  bar.innerHTML='<h3>Pinned</h3>';
  const row=document.createElement('div');row.className='pinchips';
  favs.forEach(i=>{
    const b=document.createElement('button');b.className='pinchip';b.textContent=i.t;
    b.onclick=()=>startCopy(i);row.appendChild(b);
  });
  bar.appendChild(row);
  el('pinbar').innerHTML='';el('pinbar').appendChild(bar);
}

function card(item){
  const c=document.createElement('div');
  c.className='card'+(S.flags[item.id]?' flagged':'');
  c.dataset.id=item.id;
  c.dataset.fav=S.favs[item.id]?'1':'0';
  c.dataset.search=(item.t+' '+item.b).toLowerCase();
  const n=S.counts[item.id]||0;
  c.innerHTML=`
   <div class="chead">
     <button class="star${S.favs[item.id]?' on':''}" title="Pin to top">${S.favs[item.id]?'★':'☆'}</button>
     <span class="chev">▶</span>
     <span class="ctitle">${esc(item.t)}</span>
     ${n?'<span class="meta">'+n+'×</span>':''}
     ${item._edited?'<span class="meta">edited</span>':''}
     <span class="tag ${item.ch}">${item.ch}</span>
   </div>
   <div class="cbody">
     ${item.warn?'<div class="warn">⚠ '+esc(item.warn)+'</div>':''}
     <div class="view">
       <div class="body">${highlight(item.b)}</div>
       <div class="acts">
         <button class="bcopy">Copy</button>
         <button class="bedit">Edit</button>
         <button class="bflag">${S.flags[item.id]?'Unflag':'Flag as not needed'}</button>
         ${item._edited?'<button class="brev">Revert</button>':''}
         <button class="bdel">Delete</button>
       </div>
     </div>
     <div class="ed hide"></div>
   </div>`;

  const head=c.querySelector('.chead');
  head.onclick=e=>{if(e.target.closest('.star'))return;c.classList.toggle('open');};
  c.querySelector('.star').onclick=e=>{
    e.stopPropagation();
    if(S.favs[item.id])delete S.favs[item.id];else S.favs[item.id]=true;
    saveState();render();
  };
  c.querySelector('.bcopy').onclick=e=>{e.stopPropagation();startCopy(item,c.querySelector('.bcopy'));};
  c.querySelector('.bedit').onclick=e=>{e.stopPropagation();openEditor(c,item);};
  const fb=c.querySelector('.bflag');
  fb.onclick=e=>{
    e.stopPropagation();
    if(S.flags[item.id])delete S.flags[item.id];else S.flags[item.id]=true;
    saveState();
    c.classList.toggle('flagged',!!S.flags[item.id]);
    fb.textContent=S.flags[item.id]?'Unflag':'Flag as not needed';
    filter();
  };
  const rv=c.querySelector('.brev');
  if(rv)rv.onclick=e=>{e.stopPropagation();delete S.edits[item.id];saveState();toast('Reverted to original');render();};
  c.querySelector('.bdel').onclick=e=>{
    e.stopPropagation();
    if(!confirm('Delete "'+item.t+'"? You can bring back built-in templates with Reset.'))return;
    if(item._custom)S.custom=S.custom.filter(x=>x.id!==item.id);
    else S.deleted.push(item.id);
    delete S.edits[item.id];delete S.favs[item.id];delete S.flags[item.id];
    saveState();render();toast('Deleted');
  };
  cards.push(c);
  return c;
}

/* ---------- editor ---------- */
function openEditor(c,item){
  const view=c.querySelector('.view'),ed=c.querySelector('.ed');
  c.classList.add('open');
  ed.innerHTML=`
    <label>Title</label>
    <input class="eT" value="${attr(item.t)}">
    <label>Channel</label>
    <select class="eC">
      ${['text','email','call','note'].map(o=>`<option value="${o}"${item.ch===o?' selected':''}>${o}</option>`).join('')}
    </select>
    <label>Message</label>
    <textarea class="eB">${esc(item.b)}</textarea>
    <p class="mfhelp">Click to insert: ${Object.keys(FIELDS).map(k=>`<code data-f="${k}">{{${k}}}</code>`).join(' ')}</p>
    <div class="acts" style="padding:14px 0 0">
      <button class="bsave">Save</button>
      <button class="bcancel">Cancel</button>
    </div>`;
  view.classList.add('hide');ed.classList.remove('hide');
  const ta=ed.querySelector('.eB');ta.focus();
  ed.querySelectorAll('code[data-f]').forEach(code=>{
    code.onclick=()=>{
      const tok='{{'+code.dataset.f+'}}';
      const s=ta.selectionStart,e=ta.selectionEnd;
      ta.value=ta.value.slice(0,s)+tok+ta.value.slice(e);
      ta.focus();ta.selectionStart=ta.selectionEnd=s+tok.length;
    };
  });
  ed.querySelector('.bcancel').onclick=()=>{ed.classList.add('hide');view.classList.remove('hide');};
  ed.querySelector('.bsave').onclick=()=>{
    const patch={t:ed.querySelector('.eT').value.trim()||'Untitled',
                 ch:ed.querySelector('.eC').value,
                 b:ta.value};
    if(item._custom){const c2=S.custom.find(x=>x.id===item.id);if(c2)Object.assign(c2,patch);}
    else S.edits[item.id]=patch;
    saveState();toast('Saved');render();
    const nc=document.querySelector('[data-id="'+item.id+'"]');if(nc)nc.classList.add('open');
  };
}

function newTemplate(cat){
  const id='c'+Date.now();
  S.custom.push({id,cat,t:'New template',ch:'text',b:''});
  saveState();render();
  const c=document.querySelector('[data-id="'+id+'"]');
  if(c){c.scrollIntoView({behavior:'smooth',block:'center'});openEditor(c,findItem(id));}
}

/* ============================================================
   COPY FLOW — merge-field fill-in
   ============================================================ */
function startCopy(item,btn){
  const all=usedFields(item.b);
  const ask=all.filter(f=>CONTACT_FIELDS[f]||!PROFILE_FIELDS[f]);
  const missing=all.filter(f=>PROFILE_FIELDS[f]&&!S.profile[f]);
  if(!ask.length&&!missing.length)return finishCopy(item,{},btn);
  const scrim=document.createElement('div');scrim.className='scrim';
  scrim.innerHTML=`
    <div class="modal">
      <div class="mhead"><h3>${esc(item.t)}</h3><p>Fill in the blanks — leave any field empty to keep the placeholder.</p></div>
      <div class="mbody">
        ${missing.length?`<p class="mfhelp" style="margin-bottom:12px">Missing from your profile: ${missing.map(f=>esc(PROFILE_FIELDS[f].label)).join(', ')}. <a href="#" id="goProf" style="color:var(--accent)">Set it once →</a></p>`:''}
        ${ask.map(f=>`<div class="mrow"><label>${esc((FIELDS[f]||{}).label||f)}</label>
          <input data-f="${f}" placeholder="${attr((FIELDS[f]||{}).ph||'')}"></div>`).join('')}
        <label>Preview</label>
        <div class="preview" id="pv"></div>
      </div>
      <div class="mfoot"><button class="cancel">Cancel</button><button class="prim">Copy</button></div>
    </div>`;
  document.body.appendChild(scrim);
  const ins=[...scrim.querySelectorAll('input[data-f]')];
  const pv=scrim.querySelector('#pv');
  function collect(){const o={};ins.forEach(i=>{if(i.value.trim())o[i.dataset.f]=i.value.trim();});return o;}
  function upd(){pv.textContent=fill(item.b,collect());}
  ins.forEach(i=>i.oninput=upd);upd();
  if(ins.length){ins[0].focus();ins[0].select();}
  const close=()=>scrim.remove();
  const gp=scrim.querySelector('#goProf');
  if(gp)gp.onclick=e=>{e.preventDefault();close();openTab('prof');};
  scrim.querySelector('.cancel').onclick=close;
  scrim.onclick=e=>{if(e.target===scrim)close();};
  const go=()=>{finishCopy(item,collect(),btn);close();};
  scrim.querySelector('.prim').onclick=go;
  scrim.addEventListener('keydown',e=>{
    if(e.key==='Escape'){e.preventDefault();close();}
    if(e.key==='Enter'&&e.target.tagName==='INPUT'){e.preventDefault();go();}
  });
}
function fill(text,vals){
  const all=Object.assign({},S.profile,vals);
  return text.replace(/\{\{(\w+)\}\}/g,(m,k)=>all[k]?all[k]:m);
}
async function finishCopy(item,vals,btn){
  const text=fill(item.b,vals);
  try{await navigator.clipboard.writeText(text);}
  catch(e){
    const ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.opacity='0';
    document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();
  }
  S.counts[item.id]=(S.counts[item.id]||0)+1;saveState();
  if(btn){btn.textContent='Copied ✓';btn.classList.add('ok');
    setTimeout(()=>{btn.textContent='Copy';btn.classList.remove('ok');},1400);}
  else toast('Copied: '+item.t);
  const meta=document.querySelector('[data-id="'+item.id+'"] .meta');
  if(!meta)render();
}

/* ============================================================
   FILTER + KEYBOARD
   ============================================================ */
function filter(){
  const q=el('q').value.trim().toLowerCase();
  const hf=el('hideFlag').checked, of=el('onlyFav').checked;
  let vis=0;
  cards.forEach(c=>{
    const flagged=c.classList.contains('flagged');
    const ok=(!q||c.dataset.search.includes(q))&&!(hf&&flagged)&&!(of&&c.dataset.fav!=='1');
    c.classList.toggle('hide',!ok);
    if(ok)vis++;
  });
  document.querySelectorAll('.cat-h').forEach(h=>{
    let n=h.nextElementSibling,any=false;
    while(n&&!n.classList.contains('cat-h')){
      if(n.classList.contains('card')&&!n.classList.contains('hide'))any=true;
      n=n.nextElementSibling;
    }
    h.classList.toggle('hide',!any);
    h.nextElementSibling.classList.toggle('hide',!any);
  });
  const filtering=q||hf||of;
  document.querySelectorAll('.addbtn').forEach(b=>b.classList.toggle('hide',!!filtering));
  let e=el('emptyMsg');
  if(!vis){ if(!e){e=document.createElement('p');e.id='emptyMsg';e.className='empty';content.appendChild(e);}
    e.textContent='Nothing matches. Try a different search or clear the filters.';e.classList.remove('hide');}
  else if(e)e.classList.add('hide');
  selIdx=-1;paintSel();
}
function shown(){return cards.filter(c=>!c.classList.contains('hide'));}
function paintSel(){
  cards.forEach(c=>c.classList.remove('sel'));
  const v=shown();
  if(selIdx>=0&&selIdx<v.length){v[selIdx].classList.add('sel');
    v[selIdx].scrollIntoView({block:'nearest'});}
}
el('q').oninput=filter;
el('hideFlag').onchange=filter;
el('onlyFav').onchange=filter;

document.addEventListener('keydown',e=>{
  if(document.querySelector('.scrim'))return;
  const typing=/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
  if(e.key==='/'&&!typing){e.preventDefault();el('q').focus();el('q').select();return;}
  if(e.key==='Escape'&&document.activeElement===el('q')){el('q').value='';filter();el('q').blur();return;}
  if(typing&&document.activeElement!==el('q'))return;
  const v=shown();if(!v.length)return;
  if(e.key==='ArrowDown'){e.preventDefault();selIdx=Math.min(selIdx+1,v.length-1);paintSel();}
  if(e.key==='ArrowUp'){e.preventDefault();selIdx=Math.max(selIdx-1,0);paintSel();}
  if(e.key==='Enter'&&selIdx>=0){e.preventDefault();
    const it=findItem(v[selIdx].dataset.id);if(it)startCopy(it,v[selIdx].querySelector('.bcopy'));}
});

  <p><b>Goal:</b> confirm demos early and open up additional slots.</p>
  <ul>
    <li>Call every scheduled demo for the week — confirm the time, gauge interest, identify cancellations early.</li>
    <li>If they don't answer, send the <b>Weekly Confirmation</b> text (more formal than the daily reminder).</li>
  </ul>
  <p style="color:var(--mute)"><b>Why:</b> canceled slots open early, which lets more leads into the pipeline instead of waiting on a no-show. It also separates serious prospects from passive trials.</p>
</div>
<div class="block">
  <h3>Every day</h3>
  <p><b>Morning:</b> text all same-day demos with the reminder template. Then call anyone who didn't answer yesterday's confirmation.</p>
  <p><b>Call blocks:</b> <span class="time">9:00–9:30 AM</span> or <span class="time">4:00–4:30 PM</span> for expiring and back-end calls — best answer rates. Adjust around demo load.</p>
  <p><b>Gaps and no-shows:</b> use downtime for trialing outreach — same-day post-onboarding follow-ups, weekly touchpoints, back-end calls that missed the prime window, and missed demo prospects.</p>
</div>

<h2>Demo execution</h2>
<div class="block">
  <h3>At the start</h3>
  <ul>
    <li>Join the call, then immediately send the "I'm in the meeting" text.</li>
    <li>No join after ~5 minutes → call them.</li>
    <li>No join after ~10 minutes → mark as no-show.</li>
  </ul>
  <h3>Scheduling the onboarding call</h3>
  <p>Always schedule the onboarding call <em>before</em> closing statements, and be assumptive about it — frame it as the obvious next step. Doing this raises subscribe-by-end-of-trial odds substantially.</p>
  <p><b>How:</b> in Salesmate, open the account-level view and copy the Firebase ID (center left). In Urable, click the Help Center icon (bottom right) → Book Onboarding Call → paste the ID.</p>
</div>

<h2>The close</h2>
<div class="block">
  <p>Get the commit while interest is highest. The lever is <b>50% off the first month</b> — framed as an early-commit incentive for putting a card on file now rather than at the end of the trial.</p>
  <div class="talk"><em>Opener</em>"One more thing I wanted to ask before we wrap up. Based on what you've seen here, what are your thoughts?"</div>
  <div class="talk"><em>If positive</em>"Awesome. Naturally you're trialing Urable right now, and at the end of that trial you'd be brought to this screen asking you to choose a plan. Based on everything we talked about today, I think Urable would be a great fit — so if you decide to commit by putting your card on file now for one of these plans, I can get you 50% off your first month once your trial wraps up. What do you think?"</div>
  <div class="talk"><em>If hesitant</em>"Totally get that. Well, what about this — I do have an offer I can throw out to get you 50% off your first month, get you a good feel for the platform. We're not contract-based, so if after that first month you want to pass, all good. All you'd do is put a card on file now so the incentive kicks in right after your trial ends. How does that sound?"</div>
  <div class="talk"><em>If hostile or negative</em>Abandon ship and circle back at end of trial. The discount can be re-offered as an end-of-trial or end-of-month incentive. At that point hands-on experience sells better than pushing.</div>
</div>

<h2>Calendar color system</h2>
<div class="block">
  <p><span class="swatch" style="background:#d93025"></span><b>Red</b> — no-show</p>
  <p><span class="swatch" style="background:#f0c419"></span><b>Yellow</b> — confirmed (contact made)</p>
  <p><span class="swatch" style="background:#e87ca8"></span><b>Pink</b> — no answer, needs follow-up</p>
  <p><span class="swatch" style="background:#3d8b52"></span><b>Green</b> — call completed</p>
  <p style="color:var(--mute);margin-top:8px">On a no-show: mark it in Calendly (extension or direct) and turn the calendar event red. Lets you see at a glance who needs follow-up, double confirmation, or re-engagement.</p>
</div>

<h2>CRM hygiene</h2>
<div class="block">
  <h3>Deal tags</h3>
  <p><b>Demo</b> — customer viewed a demo · <b>OCS</b> — scheduled for an onboarding call · <b>FCI</b> — first call incentive was used</p>
  <h3>Deal stages</h3>
  <p>Move the deal to the matching stage. Exception: if you closed mid-call, set <b>Closed Won</b> even if they're technically in "Onboarding Call Scheduled."</p>
  <h3>Notes</h3>
  <p>Required after every demo, stored at the <b>account level</b> so CX can see it. End with a next-steps line including the OB date/time and the assigned CX teammate tagged. The note skeleton is in Templates → Internal.</p>
  <h3>Midpoint call tagging</h3>
  <p>Tag deals 1–4 for number of real outreach attempts, so follow-ups get counted once and missed connections don't inflate the number.</p>
</div>`;

/* ============================================================
   MY INFO (profile)
   ============================================================ */
function renderProfile(){
  const v=el('viewProf');
  v.innerHTML=`
    <h2>My info</h2>
    <p style="color:var(--mute);font-size:.85rem;margin-bottom:16px">Enter your details once. Every template fills them in automatically, so you're only ever typing the customer's info. This stays on your own device — a colleague opening the same link enters their own.</p>
    <div class="block">
      ${Object.keys(PROFILE_FIELDS).map(k=>`
        <label style="display:block;font-size:.7rem;letter-spacing:.07em;text-transform:uppercase;color:var(--mute);margin:12px 0 4px">${esc(PROFILE_FIELDS[k].label)}</label>
        <input class="pf" data-f="${k}" value="${attr(S.profile[k]||'')}" placeholder="${attr(PROFILE_FIELDS[k].ph)}"
          style="width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:7px;font-size:.9rem">`).join('')}
      <div class="acts" style="padding:18px 0 0">
        <button class="bsave" id="pfSave">Save my info</button>
        <button id="pfClear">Clear all</button>
      </div>
      <p class="mfhelp" id="pfStatus" style="margin-top:10px"></p>
    </div>
    <h3 style="margin-top:24px">Preview</h3>
    <p style="color:var(--mute);font-size:.83rem;margin-bottom:8px">How a template reads with your info filled in:</p>
    <div class="block"><div class="body" id="pfPreview" style="padding:0"></div></div>`;

  const ins=[...v.querySelectorAll('input.pf')];
  const sample=findItem('fe-connect');
  function preview(){
    const tmp={};ins.forEach(i=>tmp[i.dataset.f]=i.value.trim());
    const old=S.profile;S.profile=tmp;
    el('pfPreview').innerHTML=highlight(sample?sample.b:'');
    S.profile=old;
  }
  ins.forEach(i=>i.oninput=preview);preview();

  el('pfSave').onclick=()=>{
    ins.forEach(i=>S.profile[i.dataset.f]=i.value.trim());
    saveState();render();toast('Saved — templates updated');
    el('pfStatus').textContent='Saved. Every template now uses these details.';
  };
  el('pfClear').onclick=()=>{
    if(!confirm('Clear your saved info?'))return;
    S.profile=defaultProfile();saveState();renderProfile();render();toast('Cleared');
  };
}

/* ============================================================
   TABS
   ============================================================ */
function openTab(name){
  document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x.dataset.tab===name));
  el('viewLib').classList.toggle('hide',name!=='lib');
  el('viewCad').classList.toggle('hide',name!=='cad');
  el('viewPlay').classList.toggle('hide',name!=='play');
  el('viewProf').classList.toggle('hide',name!=='prof');
  nav.classList.toggle('hide',name!=='lib');
  if(name==='cad')renderCadence();
  if(name==='prof')renderProfile();
  window.scrollTo({top:0});
}
document.querySelectorAll('.tab').forEach(t=>{t.onclick=()=>openTab(t.dataset.tab);});

/* ============================================================
   BACKUP / RESTORE / RESET
   ============================================================ */
el('bExport').onclick=()=>{
  const blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='salesdesk-backup-'+new Date().toISOString().slice(0,10)+'.json';
  a.click();URL.revokeObjectURL(a.href);
};
el('bImport').onclick=()=>el('fileIn').click();
el('fileIn').onchange=ev=>{
  const f=ev.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{try{
    const d=JSON.parse(r.result);
    S={flags:d.flags||{},favs:d.favs||{},edits:d.edits||{},custom:d.custom||[],deleted:d.deleted||[],counts:d.counts||{},
       profile:Object.assign(defaultProfile(),d.profile||{})};
    saveState();render();toast('Backup restored');
  }catch(e){toast('That file could not be read as a backup.');}};
  r.readAsText(f);ev.target.value='';
};
el('bReset').onclick=()=>{
  if(!confirm('This clears every edit, pin, flag, and template you added. Your saved info stays.'))return;
  const p=S.profile;
  S={flags:{},favs:{},edits:{},custom:[],deleted:[],counts:{},profile:p};
  saveState();render();toast('Templates reset to defaults');
};

render();
if(!S.profile.myname||!S.profile.myphone)openTab('prof');
</script>
</body>
</html>
