<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Urable Sales Template Library</title>
<style>
  :root{
    --ink:#1c2431;
    --paper:#f6f7f4;
    --card:#ffffff;
    --line:#dfe3da;
    --accent:#155e75;
    --accent-soft:#e3f0f3;
    --amber:#b45309;
    --flag:#9aa3ad;
    --mono:'SF Mono', ui-monospace, 'Cascadia Code', Menlo, monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Avenir Next','Segoe UI',system-ui,sans-serif;background:var(--paper);color:var(--ink);line-height:1.5}
  header{background:var(--ink);color:#fff;padding:24px 28px 20px;display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between}
  header h1{font-size:1.3rem;font-weight:600}
  header p{color:#9fb3c8;font-size:.82rem;margin-top:4px}
  .hdr-actions{display:flex;gap:8px;flex-wrap:wrap}
  .hdr-actions button{font:inherit;font-size:.78rem;padding:7px 13px;border-radius:7px;cursor:pointer;border:1px solid #3c4757;background:#2a3444;color:#e6edf5}
  .hdr-actions button:hover{background:#374252}
  .layout{display:flex;min-height:calc(100vh - 90px)}
  nav{width:235px;flex-shrink:0;background:var(--card);border-right:1px solid var(--line);padding:16px 0;position:sticky;top:0;align-self:flex-start;max-height:100vh;overflow-y:auto}
  nav button{display:block;width:100%;text-align:left;padding:9px 20px;border:none;background:none;cursor:pointer;font:inherit;font-size:.87rem;color:var(--ink);border-left:3px solid transparent}
  nav button:hover{background:var(--accent-soft)}
  nav button.active{border-left-color:var(--accent);background:var(--accent-soft);font-weight:600}
  nav .count{color:#8b95a1;font-size:.74rem;margin-left:5px}
  main{flex:1;padding:24px 30px;max-width:880px}
  .toolbar{display:flex;gap:10px;margin-bottom:18px;flex-wrap:wrap}
  .searchbar{flex:1;min-width:200px;padding:10px 14px;border:1px solid var(--line);border-radius:8px;font:inherit;font-size:.9rem;background:var(--card)}
  .toolbar label{display:flex;align-items:center;gap:6px;font-size:.82rem;color:#5b6470}
  .cat-title{font-size:1.03rem;font-weight:700;margin:24px 0 4px}
  .cat-desc{font-size:.81rem;color:#6b7480;margin-bottom:12px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;margin-bottom:13px;overflow:hidden}
  .card.flagged{opacity:.55}
  .card.flagged .body{text-decoration:line-through;color:var(--flag)}
  .card-head{display:flex;align-items:center;gap:10px;padding:11px 16px;cursor:pointer;user-select:none}
  .card-head:hover{background:#fafbf8}
  .chev{transition:transform .15s;font-size:.7rem;color:#8b95a1}
  .card.open .chev{transform:rotate(90deg)}
  .card-title{font-weight:600;font-size:.92rem;flex:1}
  .edited-dot{font-size:.68rem;color:var(--accent);font-weight:600}
  .tag{font-size:.67rem;font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding:2px 8px;border-radius:20px;background:var(--accent-soft);color:var(--accent)}
  .tag.email{background:#fdf1e3;color:var(--amber)}
  .tag.note{background:#eee;color:#666}
  .card-body{display:none;border-top:1px solid var(--line)}
  .card.open .card-body{display:block}
  .body{white-space:pre-wrap;font-family:var(--mono);font-size:.82rem;padding:16px;line-height:1.6;color:#2b3442}
  textarea.editor{width:calc(100% - 32px);margin:16px;font-family:var(--mono);font-size:.82rem;line-height:1.6;padding:12px;border:1px solid var(--accent);border-radius:8px;resize:vertical;min-height:150px;background:#fbfdfd}
  input.title-editor{width:calc(100% - 32px);margin:16px 16px 0;font:inherit;font-weight:600;font-size:.92rem;padding:8px 10px;border:1px solid var(--line);border-radius:7px}
  .actions{display:flex;gap:8px;padding:0 16px 14px;flex-wrap:wrap}
  .actions button{font:inherit;font-size:.79rem;padding:6px 13px;border-radius:7px;cursor:pointer;border:1px solid var(--line);background:#fff}
  .actions button:hover{background:#f2f3f0}
  .btn-copy{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:600}
  .btn-copy:hover{background:#0e4a5c}
  .btn-copy.copied{background:#1a7f4f;border-color:#1a7f4f}
  .btn-save{background:#1a7f4f;color:#fff;border-color:#1a7f4f;font-weight:600}
  .btn-save:hover{background:#166b43}
  .card.flagged .btn-flag{background:var(--ink);color:#fff;border-color:var(--ink)}
  .dup-note{font-size:.75rem;color:var(--amber);padding:12px 16px 0;font-style:italic}
  .hidden{display:none!important}
  .add-btn{display:block;width:100%;padding:11px;border:1px dashed var(--line);border-radius:10px;background:none;font:inherit;font-size:.84rem;color:#6b7480;cursor:pointer;margin-bottom:22px}
  .add-btn:hover{background:#fff;border-color:var(--accent);color:var(--accent)}
  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 20px;border-radius:8px;font-size:.85rem;opacity:0;transition:opacity .25s;pointer-events:none;z-index:50}
  .toast.show{opacity:1}
  @media(max-width:720px){
    .layout{flex-direction:column}
    nav{width:100%;position:static;display:flex;flex-wrap:wrap;padding:8px;max-height:none;border-right:none;border-bottom:1px solid var(--line)}
    nav button{width:auto;border-left:none;border-radius:20px;padding:6px 12px}
    nav button.active{border-left:none}
    main{padding:18px}
  }
</style>
</head>
<body>
<header>
  <div>
    <h1>Urable Sales Template Library</h1>
    <p>Click to expand · Copy · Edit and save · Flag what you don't need</p>
  </div>

    <button id="reset">Reset all changes</button>

const KEY='urable-library-v2';
let state = load();

function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return {flags:{}, edits:{}, custom:[], deleted:[]};
}
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(state)); }
  catch(e){ toast('Could not save — browser storage is blocked here. Use Download backup.'); }
}
function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  clearTimeout(t._x); t._x=setTimeout(()=>t.classList.remove('show'),2200);
}

function allCategories(){
  const cats = DEFAULTS.map(c=>({cat:c.cat, desc:c.desc, items:c.items.filter(i=>!state.deleted.includes(i.id)).map(i=>{
    const e = state.edits[i.id]||{};
    return Object.assign({}, i, e, {_edited: !!(e.t||e.b)});
  })}));
  state.custom.forEach(ci=>{
    const e = state.edits[ci.id]||{};
    if(state.deleted.includes(ci.id)) return;
    let target = cats.find(c=>c.cat===ci.cat);
    if(!target){ target={cat:ci.cat, desc:"Your added templates.", items:[]}; cats.push(target); }
    target.items.push(Object.assign({}, ci, e, {_custom:true, _edited: !!(e.t||e.b)}));
  });
  return cats;
}

const nav=document.getElementById('nav'), content=document.getElementById('content');

function render(){
  nav.innerHTML=''; content.innerHTML='';
  const cats=allCategories();
  cats.forEach((cat,ci)=>{
    const nb=document.createElement('button');
    nb.innerHTML=cat.cat+' <span class="count">'+cat.items.length+'</span>';
    nb.onclick=()=>{ document.getElementById('cat-'+ci).scrollIntoView({behavior:'smooth'});
      nav.querySelectorAll('button').forEach(b=>b.classList.remove('active')); nb.classList.add('active'); };
    nav.appendChild(nb);

    const h=document.createElement('h2'); h.className='cat-title'; h.id='cat-'+ci; h.textContent=cat.cat;
    const d=document.createElement('p'); d.className='cat-desc'; d.textContent=cat.desc;
    content.appendChild(h); content.appendChild(d);
    cat.items.forEach(item=>content.appendChild(makeCard(item)));

    const add=document.createElement('button');
    add.className='add-btn'; add.textContent='+ Add a template to '+cat.cat;
    add.onclick=()=>{
      const id='custom-'+Date.now();
      state.custom.push({id, cat:cat.cat, t:'New template', ch:'text', b:''});
      save(); render();
      setTimeout(()=>{
        const el=document.querySelector('[data-id="'+id+'"]');
        if(el){ el.classList.add('open'); el.scrollIntoView({behavior:'smooth',block:'center'}); el.querySelector('.btn-edit').click(); }
      },50);
    };
    content.appendChild(add);
  });
  applyFilter();
}

function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;');}

function makeCard(item){
  const card=document.createElement('div');
  card.className='card'+(state.flags[item.id]?' flagged':'');
  card.dataset.id=item.id;
  card.dataset.search=(item.t+' '+item.b).toLowerCase();
  card.innerHTML=`
    <div class="card-head">
      <span class="chev">\u25B6</span>
      <span class="card-title">${esc(item.t)}</span>
      ${item._edited?'<span class="edited-dot">edited</span>':''}
      <span class="tag ${item.ch}">${item.ch}</span>
    </div>
    <div class="card-body">
      ${item.dup?'<div class="dup-note">\u26A0\uFE0F '+item.dup+'</div>':''}
      <div class="view">
        <div class="body">${esc(item.b)}</div>
        <div class="actions">
          <button class="btn-copy">Copy template</button>
          <button class="btn-edit">Edit</button>
          <button class="btn-flag">${state.flags[item.id]?'Unflag':'Flag as not needed'}</button>
          ${item._edited?'<button class="btn-revert">Revert to original</button>':''}
          ${item._custom?'<button class="btn-delete">Delete</button>':''}
        </div>
      </div>
      <div class="edit hidden">
        <input class="title-editor" value="${esc(item.t).replace(/"/g,'&quot;')}">
        <textarea class="editor">${esc(item.b)}</textarea>
        <div class="actions">
          <button class="btn-save">Save changes</button>
          <button class="btn-cancel">Cancel</button>
        </div>
      </div>
    </div>`;

  card.querySelector('.card-head').onclick=()=>card.classList.toggle('open');

  const copyBtn=card.querySelector('.btn-copy');
  copyBtn.onclick=async e=>{
    e.stopPropagation();
    const text=item.b;
    try{ await navigator.clipboard.writeText(text); }
    catch(err){ const ta=document.createElement('textarea'); ta.value=text; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); }
    copyBtn.textContent='Copied \u2713'; copyBtn.classList.add('copied');
    setTimeout(()=>{copyBtn.textContent='Copy template';copyBtn.classList.remove('copied');},1500);
  };

  const view=card.querySelector('.view'), edit=card.querySelector('.edit');
  card.querySelector('.btn-edit').onclick=e=>{ e.stopPropagation(); view.classList.add('hidden'); edit.classList.remove('hidden'); edit.querySelector('.editor').focus(); };
  card.querySelector('.btn-cancel').onclick=e=>{ e.stopPropagation(); edit.classList.add('hidden'); view.classList.remove('hidden'); };
  card.querySelector('.btn-save').onclick=e=>{
    e.stopPropagation();
    state.edits[item.id]={t:edit.querySelector('.title-editor').value, b:edit.querySelector('.editor').value};
    save(); toast('Saved'); render();
    const el=document.querySelector('[data-id="'+item.id+'"]'); if(el) el.classList.add('open');
  };

  const flagBtn=card.querySelector('.btn-flag');
  flagBtn.onclick=e=>{
    e.stopPropagation();
    if(state.flags[item.id]) delete state.flags[item.id]; else state.flags[item.id]=true;
    save();
    card.classList.toggle('flagged', !!state.flags[item.id]);
    flagBtn.textContent=state.flags[item.id]?'Unflag':'Flag as not needed';
    applyFilter();
  };

  const rev=card.querySelector('.btn-revert');
  if(rev) rev.onclick=e=>{ e.stopPropagation(); delete state.edits[item.id]; save(); toast('Reverted'); render(); };
  const del=card.querySelector('.btn-delete');
  if(del) del.onclick=e=>{
    e.stopPropagation();
    if(!confirm('Delete this template permanently?')) return;
    state.custom=state.custom.filter(c=>c.id!==item.id); delete state.edits[item.id];
    save(); render();
  };
  return card;
}

function applyFilter(){
  const q=document.getElementById('search').value.trim().toLowerCase();
  const hide=document.getElementById('hideFlagged').checked;
  document.querySelectorAll('.card').forEach(c=>{
    const flagged=c.classList.contains('flagged');
    const match=!q||c.dataset.search.includes(q);
    c.classList.toggle('hidden', !match || (hide&&flagged));
  });
  document.querySelectorAll('.cat-title').forEach(h=>{
    let el=h.nextElementSibling, any=false;
    while(el&&!el.classList.contains('cat-title')){
      if(el.classList.contains('card')&&!el.classList.contains('hidden')) any=true;
      el=el.nextElementSibling;
    }
    const show=any||!q;
    h.classList.toggle('hidden',!show);
    h.nextElementSibling.classList.toggle('hidden',!show);
  });
  document.querySelectorAll('.add-btn').forEach(b=>b.classList.toggle('hidden', !!q));
}

document.getElementById('search').oninput=applyFilter;
document.getElementById('hideFlagged').onchange=applyFilter;

document.getElementById('export').onclick=()=>{
  const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='urable-templates-backup.json';
  a.click(); URL.revokeObjectURL(a.href);
};
document.getElementById('import').onclick=()=>document.getElementById('fileInput').click();
document.getElementById('fileInput').onchange=ev=>{
  const f=ev.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const d=JSON.parse(r.result);
      state={flags:d.flags||{}, edits:d.edits||{}, custom:d.custom||[], deleted:d.deleted||[]};
      save(); render(); toast('Backup restored');
    }catch(e){ toast('That file could not be read as a backup.'); }
  };
  r.readAsText(f); ev.target.value='';
};
document.getElementById('reset').onclick=()=>{
  if(!confirm('This removes all your edits, flags, and added templates. Continue?')) return;
  state={flags:{},edits:{},custom:[],deleted:[]}; save(); render(); toast('Reset to original');
};

render();
</script>
</body>
</html>
